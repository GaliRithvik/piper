[package]
name = "piper"
version = "0.9.1"
edition = "2021"
description = "Piper — Python-like syntax, Rust-powered interpreter"

[[bin]]
name = "piper"
path = "src/main.rs"

[lib]
name = "piper"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

# HTTP server + Ollama client — native targets only
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
ureq = { version = "2.10", features = ["json"] }
serde_json = "1"
