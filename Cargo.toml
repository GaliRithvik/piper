[package]
name = "piper"
version = "0.1.0"
edition = "2021"
description = "Piper — Python-like syntax, Rust-powered interpreter"

[[bin]]
name = "piper"
path = "src/main.rs"

[lib]
name = "piper"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
